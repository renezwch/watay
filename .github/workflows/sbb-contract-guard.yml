name: Watay SBB Contract Guard & SDK Pipeline

on:
  pull_request:
    paths:
      - 'showcases/specs/sbb-transport-v1.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  watay-contract-guard:
    name: Watay Contract Guard & SDK Build (SBB API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Branch with Base History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Watay Contract Guard & SDK Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SPEC_PATH: showcases/specs/sbb-transport-v1.json
          INPUT_BASE_REF: origin/main
          INPUT_LANGUAGES: ts,python
          INPUT_OUTPUT_DIR: ./showcases/generated/sbb-transport
          INPUT_FAIL_ON_BREAKING: 'false'
          INPUT_POST_COMMENT: 'true'
          INPUT_LICENSE_KEY: WATAY-DEMO-PRO
        run: node --experimental-strip-types src/action/runner.ts

      - name: Execute Live SBB Internet Call with Generated SDKs
        run: |
          node --experimental-strip-types showcases/live-sbb-demo.ts
          python3 showcases/live-sbb-demo.py
